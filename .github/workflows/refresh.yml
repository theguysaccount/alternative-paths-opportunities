# Daily: read Washington State's registered apprenticeship datasets (data.wa.gov), rebuild the
# listings (active, paid, no personal data), run the tests, commit, then redeploy so expired
# programs drop off and new ones appear. The state updates the data monthly; daily runs make sure
# a missed scheduled run never leaves the site a month behind.
# Fails safely: a failed or suspicious read keeps the last good data (and says so); failing tests stop
# the commit. Safe to re-run: the same data produces the same files.
name: Refresh listings

on:
  schedule:
    - cron: "29 6 * * *"    # 06:29 UTC
    - cron: "29 18 * * *"   # 18:29 UTC (second slot: GitHub drops scheduled runs on this account)
    - cron: "7 */4 22,23 11 *"   # TEMPORARY: proves the schedule trigger on 22-23 Nov 2026 only. Remove after the first scheduled run.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read Washington's apprenticeship register
        run: python3 -m pipeline.wa
      - name: Tests (refuse to commit data that breaks the build)
        run: python3 -m unittest discover -s tests
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wa
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -q -m "Listings refresh $(date -u +%F)"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Could not push the refreshed listings; the next run will try again."
          exit 1
      - name: Rebuild and redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

  keepalive:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/keepalive.sh
